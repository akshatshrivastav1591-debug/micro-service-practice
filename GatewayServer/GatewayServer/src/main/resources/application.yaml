spring:
  application:
    name: GatewayServer
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8071/}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lowerCaseServiceId: true
          httpclient:
            connect-timeout: 1000 # The time that is allowed to circuit breaker to connect with the service
            response-timeout: 10s # The time that is allowed to get the response from the micro-service
management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true

  endpoint:
    gateway:
      access: unrestricted

info:
  app:
    name: "Gateway server "
    description: "This is the gateway of our micro-services:"
    version: "v1"
    authenticity: "This Service is authenticated by Akshat Shrivastav:"
resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10  # Total number of calls it considered for calculating the success/failure rate
      minimumNumberOfCalls: 5 # Total number of calls out of which the rate of success/failure is calculated example->  if it is 6 and failureRateThreshold is 50, if three calls are failed the circuit breaker will be opened:
      failureRateThreshold: 50 # The percentage of success/failure out of minimum calls or slidingwindow size
      permittedNumberOfCallsInHalfOpenState: 2 # In the State of halfopen the number of attempts that is allowed to send to microservices
      waitDurationInOpenState: 10000 # In the State of halfopen the duration of resuming the traffic to that micro-service

